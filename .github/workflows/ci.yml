name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install pytest

      - name: Build data pipeline
        run: |
          python enrich_data.py
          python build.py --validate --stats

      - name: Verify build output is committed (no drift)
        run: |
          # status, not diff: a missing or extra file in resource/ is untracked
          test -z "$(git status --porcelain data/resources.json data/stats.json data/search-index.json sitemap.xml feed.json opensearch.xml resource)" \
            || (git status --short resource data sitemap.xml feed.json opensearch.xml | head -20; echo "::error::Generated files are stale. Run 'make build' and commit the result." && exit 1)

      - name: Run tests
        run: python -m pytest -q

      # Reads the two token blocks out of css/style.css and measures every ink
      # against every surface it can land on. No browser and no network, so it
      # belongs in front of a pull request rather than on a schedule.
      - name: Colour contrast
        run: python check_contrast.py
