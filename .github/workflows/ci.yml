name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install pytest

      - name: Build data pipeline
        run: |
          python enrich_data.py
          python build.py --validate --stats

      - name: Verify build output is committed (no drift)
        run: |
          git diff --exit-code data/resources.json data/stats.json data/search-index.json sitemap.xml feed.json opensearch.xml \
            || (echo "::error::Generated files are stale. Run 'make build' and commit the result." && exit 1)

      - name: Run tests
        run: python -m pytest -q

      # Reads the two token blocks out of css/style.css and measures every ink
      # against every surface it can land on. No browser and no network, so it
      # belongs in front of a pull request rather than on a schedule.
      - name: Colour contrast
        run: python check_contrast.py
